name: V3.14 Timing-Safe Cost Sensitivity

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window in days"
        required: false
        default: "60"
  push:
    branches:
      - research/v314-cost-sensitivity-20261025
    paths:
      - backtest_v314_timing_safe.py
      - analyze_v314_cost_sensitivity.py
      - .github/workflows/v314-cost-sensitivity.yml

permissions:
  contents: read

jobs:
  cost-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/v314-cost-sensitivity-20261025

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests pandas numpy

      - name: Compile and run deterministic self-tests
        run: |
          python -m py_compile btc_analyzer.py backtest_v314_timing_safe.py analyze_v314_cost_sensitivity.py
          python - <<'PY'
          import btc_analyzer
          import backtest_v314_timing_safe as bt
          assert btc_analyzer.route_realistic_self_test() == "PASS"
          assert bt.timing_safety_self_test() == "PASS"
          print("ROUTE_SELF_TEST=PASS")
          print("TIMING_SAFETY_SELF_TEST=PASS")
          PY

      - name: Run timing-safe historical backtest
        env:
          DAYS: ${{ github.event.inputs.days || '60' }}
        run: |
          mkdir -p data
          python backtest_v314_timing_safe.py --days "$DAYS" --output data/v314_timing_safe_backtest.csv

      - name: Analyze fee and slippage scenarios
        run: |
          python analyze_v314_cost_sensitivity.py --input data/v314_timing_safe_backtest.csv --trades-output data/v314_cost_sensitivity_trades.csv --summary-output data/v314_cost_sensitivity_summary.csv

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: v3.14-cost-sensitivity-${{ github.run_number }}
          path: data/*.csv
          retention-days: 30
