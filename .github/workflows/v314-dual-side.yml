name: V3.14 Dual-Side Research

on:
  push:
    branches:
      - "research/v314-dual-side-test"
    paths:
      - "research_v314_dual_side.py"
      - "backtest_v314.py"
      - "btc_analyzer.py"
      - ".github/workflows/v314-dual-side.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests pandas numpy

      - name: Run dual-side research
        run: python research_v314_dual_side.py --days 60 --initial-equity 1000000 --fee 0 --slippage 0 | tee dual_side_results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: v314-dual-side-results
          path: dual_side_results.txt