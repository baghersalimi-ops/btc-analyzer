name: V3.14 Signal Outcome Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: v314-signal-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V3.14 branch
        uses: actions/checkout@v4
        with:
          ref: v3.14-pullback-trade-plan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run outcome tracker
        run: |
          python tracker.py --output data/signal_outcomes.csv

      - name: Commit tracker state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signal_outcomes.csv
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
            exit 0
          fi
          git commit -m "Update V3.14 signal outcomes"
          git push origin HEAD:v3.14-pullback-trade-plan
