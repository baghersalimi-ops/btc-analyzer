name: V3.14 Binance Public API Validation

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window in days"
        required: false
        default: "60"
  push:
    branches:
      - research/v314-binance-validation-20261026
    paths:
      - backtest_v314_binance_validation.py
      - .github/workflows/v314-binance-validation.yml

permissions:
  contents: read

jobs:
  binance-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/v314-binance-validation-20261026

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests pandas numpy

      - name: Compile and deterministic checks
        run: |
          python -m py_compile btc_analyzer.py backtest_v314_timing_safe.py analyze_v314_cost_sensitivity.py backtest_v314_binance_validation.py
          python - <<'PY'
          import btc_analyzer
          import backtest_v314_timing_safe as bt
          assert btc_analyzer.route_realistic_self_test() == "PASS"
          assert bt.timing_safety_self_test() == "PASS"
          print("ROUTE_SELF_TEST=PASS")
          print("TIMING_SAFETY_SELF_TEST=PASS")
          PY

      - name: Run Binance BTCUSDT benchmark backtest
        env:
          DAYS: ${{ github.event.inputs.days || '60' }}
        run: |
          mkdir -p data
          python backtest_v314_binance_validation.py --days "$DAYS" --output data/v314_binance_backtest.csv

      - name: Analyze Binance fee sensitivity
        run: |
          python analyze_v314_cost_sensitivity.py --input data/v314_binance_backtest.csv --trades-output data/v314_binance_cost_trades.csv --summary-output data/v314_binance_cost_summary.csv

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3.14-binance-validation-${{ github.run_number }}
          path: data/v314_binance_*.csv
          retention-days: 30
